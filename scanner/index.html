<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CryptoScan · Operations Center</title>
<meta name="description" content="Central de operações do CryptoScan: agentes, corretoras Bybit UE e OKX EEA, posições reais e mercado, só em consulta.">
<meta name="theme-color" content="#05080E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script>/* versao da pagina: a versao anterior (v1.html) e as paginas abertas comparam isto */ const PAGE_V="20261110c";</script>
<style>
:root{
  --bg:#05080E; --p:#0A111C; --p2:#0D1624; --linha:#17233A; --linha2:#21314D; --tx:#DCE6F2; --fr:#7F90A6; --ac:#3EE0C4;
  --up:#3FD68F; --dn:#F0616D; --av:#F5B83D; --info:#7FE3FF; --okx:#E6EDF7; --bybit:#F7A600;
  --r:12px; --f:Inter,system-ui,-apple-system,Segoe UI,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow-x:hidden;background:var(--bg);color:var(--tx);font:14px/1.45 var(--f);-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
.up{color:var(--up)} .dn{color:var(--dn)}
#app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr;height:100vh;height:100dvh}
/* topo */
header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--linha);background:linear-gradient(180deg,#081019,#05080E)}
.marca{display:flex;align-items:center;gap:10px;white-space:nowrap}
.marca svg{width:28px;height:28px}
.marca b{font-weight:700;letter-spacing:.06em}
.marca span{color:var(--fr);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.pill{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:99px;border:1px solid var(--linha2);font-weight:600;font-size:13px;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--fr)}
.pill.ok i{background:var(--up);box-shadow:0 0 10px var(--up)} .pill.aviso i{background:var(--av)} .pill.critico i,.pill.falha i{background:var(--dn);box-shadow:0 0 10px var(--dn)}
#fontes{display:flex;gap:4px}
.dot{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:var(--fr)}
.dot.ligado{background:var(--up)} .dot.bloqueado{background:#6E7FA3} .dot.atrasado{background:var(--av)} .dot.desatualizado,.dot.falhou{background:var(--dn)}
.sp{flex:1}
#relogio,#sinc{color:var(--fr);font:12px var(--mono);white-space:nowrap}
.btn{background:var(--p2);border:1px solid var(--linha2);border-radius:8px;padding:6px 11px;font-size:13px;font-weight:600}
.btn:hover{border-color:var(--ac)} .btn.on{border-color:var(--ac);color:var(--ac)}
.seg{display:inline-flex;border:1px solid var(--linha2);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 10px;font-size:12px;font-weight:600;color:var(--fr)}
.seg button.on{background:#12223A;color:var(--tx)}
/* kpis */
#kpis{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;border-bottom:1px solid var(--linha);scrollbar-width:thin}
.kpi{flex:0 0 auto;min-width:132px;max-width:250px;text-align:left;background:var(--p);border:1px solid var(--linha);border-radius:10px;padding:7px 11px;position:relative}
.kpi:hover{border-color:var(--linha2);background:var(--p2)}
.kpi span{display:block;color:var(--fr);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.kpi b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:transparent}
.kpi.ok::before{background:var(--up)} .kpi.aviso::before{background:var(--av)} .kpi.critico::before{background:var(--dn)} .kpi.pub::before{background:#6E7FA3}
/* palco 3D e paineis flutuantes */
main{position:relative;overflow:hidden}
#palco{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#0A1320,#05080E 70%)}
#palco canvas{touch-action:none}
.of-overlay{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.of-tag{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;background:#070D17D9;border:1px solid var(--linha2);border-radius:99px;padding:3px 10px 3px 7px;font-size:11.5px;white-space:nowrap;backdrop-filter:blur(4px);transition:border-color .2s}
.of-tag i{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.of-tag span{color:var(--fr)}
.of-tag.compacta span{display:none}
.of-tag.sel{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.of-tag[data-estado=desligado]{opacity:.6} .of-tag[data-estado=erro]{border-color:var(--dn)}
#zonas{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:5;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 640px)}
#zonas button{background:#081019CC;border:1px solid var(--linha2);border-radius:99px;padding:5px 11px;font-size:12px;backdrop-filter:blur(6px)}
#zonas button:hover{border-color:var(--ac)}
.painel{position:absolute;z-index:6;background:#08101BEE;border:1px solid var(--linha2);border-radius:var(--r);backdrop-filter:blur(10px);display:flex;flex-direction:column;box-shadow:0 20px 50px -20px #000}
.painel>h3{display:flex;align-items:center;gap:8px;margin:0;padding:10px 12px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--fr);border-bottom:1px solid var(--linha)}
.painel>h3 .sp{flex:1}
.painel>h3>button{background:transparent;border:1px solid var(--linha2);border-radius:6px;width:24px;height:22px;line-height:1;padding:0;color:var(--fr)}
.painel.min>:not(h3){display:none}
.painel .corpo{overflow:auto;padding:10px 12px;flex:1}
#agentes{left:12px;top:12px;bottom:12px;width:300px}
#agentes.min{bottom:auto}
.ag{display:flex;gap:10px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:10px;padding:8px;margin-bottom:4px}
.ag:hover{background:var(--p2);border-color:var(--linha)} .ag.sel{border-color:var(--ac);background:#0C1B26}
.ag>i{flex:0 0 30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#05080E;font-style:normal;font-weight:700}
.ag div{flex:1;min-width:0} .ag b{display:block;font-size:13.5px}
.ag small{display:block;color:var(--fr);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag small.act{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ag em{display:block;font-style:normal;font-size:12px;font-weight:600}
.ag time{color:var(--fr);font:10.5px var(--mono);white-space:nowrap}
#inspector{right:12px;top:12px;bottom:12px;width:430px;transform:translateX(calc(100% + 24px));transition:transform .28s ease}
#inspector.on{transform:none}
#inspector.max{left:330px;width:auto}
#insp-titulo{color:var(--tx);text-transform:none;letter-spacing:0;font-size:14px;font-weight:600}
.doca{left:324px;right:12px;bottom:12px;height:32%;max-height:360px;min-height:180px}
#inspector.on~.doca{right:454px}
.doca.min{height:auto}
.doca.max{height:calc(100% - 24px);max-height:none;top:12px}
.tabs{display:flex;gap:2px;flex-wrap:nowrap;overflow-x:auto;min-width:0;flex:1;scrollbar-width:none}
.tabs button{white-space:nowrap;flex:0 0 auto;background:transparent;border:0;border-radius:6px;padding:4px 9px;font-size:12px;font-weight:600;color:var(--fr);text-transform:none;letter-spacing:0}
.tabs button.on{background:#12223A;color:var(--tx)}
h4{margin:14px 0 6px;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--fr)}
h4:first-child{margin-top:2px}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0}
dt{color:var(--fr);font-size:12px} dd{margin:0;font-size:13px}
code{font:12px var(--mono);color:var(--info)}
.badge{display:inline-block;border:1px solid;border-radius:99px;padding:3px 10px;font-weight:600;font-size:12.5px}
.badge.ok{color:var(--up)} .badge.pub{color:var(--ac)} .badge.aviso{color:var(--av)} .badge.critico{color:var(--dn)}
.nota{color:var(--fr);font-size:13px;margin:6px 0}
.nota button,.acoes button{background:var(--p2);border:1px solid var(--linha2);border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:600;margin:2px 4px 2px 0}
.acoes{margin-top:12px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin:10px 0}
.kv div{background:var(--p);border:1px solid var(--linha);border-radius:8px;padding:6px 8px}
.kv span{display:block;color:var(--fr);font-size:11px} .kv b{font-size:13px}
.lst{list-style:none;margin:0;padding:0}
.lst li{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--linha);font-size:12.5px}
.lst li:first-child{border-top:0}
.lst li b{flex:0 0 auto;min-width:92px;font-weight:600;color:var(--tx)} .lst li span{color:#B6C3D6}
.lst li.critico b{color:var(--dn)} .lst li.aviso b{color:var(--av)} .lst li.info b{color:var(--info)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{text-align:left;color:var(--fr);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:6px 8px;border-bottom:1px solid var(--linha);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid #111B2C;white-space:nowrap}
tr[data-acao]{cursor:pointer} tr[data-acao]:hover td{background:#0D1A2A}
.st-ligado{color:var(--up)} .st-falhou,.st-desatualizado{color:var(--dn)} .st-atrasado{color:var(--av)} .st-bloqueado{color:#8FA0C8}
.filtros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.filtros label{display:flex;gap:6px;align-items:center;color:var(--fr);font-size:12px;text-transform:capitalize}
.filtros select{background:var(--p2);border:1px solid var(--linha2);border-radius:7px;padding:4px 8px}
.grelha3{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 18px}
.mapa{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:4px}
.mapa button{border:0;border-radius:6px;padding:6px;text-align:left;font-size:11.5px;color:#E8F0FA;
  background:color-mix(in srgb,var(--up) calc(max(var(--k),0)*60% + 6%),color-mix(in srgb,var(--dn) calc(max(calc(var(--k)*-1),0)*60% + 6%),#0A111C))}
.mapa b{display:block;font-size:12.5px}
.graf{margin:8px 0;border:1px solid var(--linha);border-radius:8px;overflow:hidden;background:#070C14}
.graf canvas{display:block;width:100%}
.sem3d{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--fr);max-width:420px;text-align:center}
#erro-arranque{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#2A0F14;border:1px solid var(--dn);padding:8px 14px;border-radius:8px;z-index:50}
#carregar{position:absolute;inset:0;display:grid;place-items:center;color:var(--fr);z-index:4;pointer-events:none;transition:opacity .4s}
body.carregado #carregar{opacity:0}
/* modo 2D (sem 3D ou por escolha): os paineis passam a grelha */
body.modo2d #palco,body.modo2d #zonas{display:none}
body.modo2d main{overflow:auto}
body.modo2d #agentes{position:relative;left:auto;top:auto;bottom:auto;width:auto;margin:12px}
body.modo2d .doca{position:relative;left:auto;right:auto;bottom:auto;height:auto;max-height:none;margin:12px}
body.modo2d #inspector{position:fixed}
/* telemovel */
@media (max-width:860px){
  header{flex-wrap:wrap;gap:8px;padding:8px 12px}
  .marca span,#sinc{display:none}
  #relogio{order:9;width:100%;font-size:11px}
  .btn,.seg button{padding:5px 8px;font-size:12px}
  #kpis{padding:8px 12px}
  #app{grid-template-rows:auto auto auto;height:auto;min-height:100dvh}
  main{overflow:visible}
  #palco{position:relative;height:48vh}
  #zonas{position:relative;top:auto;left:auto;transform:none;max-width:none;padding:8px 12px;justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto}
  #zonas button{flex:0 0 auto}
  #agentes,.doca{position:relative;left:auto;right:auto;top:auto;bottom:auto;width:auto;height:auto;max-height:none;margin:10px 12px}
  #agentes .corpo{max-height:46vh}
  #inspector{position:fixed;left:0;right:0;top:auto;bottom:0;width:auto;height:84vh;border-radius:16px 16px 0 0;transform:translateY(102%)}
  #inspector.on{transform:none} #inspector.max{left:0;height:100dvh}
  #inspector.on~.doca{right:auto}
}
@media (prefers-reduced-motion:reduce){#inspector{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="marca" aria-label="CryptoScan">
      <svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#3EE0C4"/><stop offset="1" stop-color="#5AA9FF"/></linearGradient></defs>
        <path d="M16 2 29 9.5v13L16 30 3 22.5v-13z" fill="none" stroke="url(#lg)" stroke-width="2"/><path d="M9 19l4.5-5 3.5 3 6-7" fill="none" stroke="url(#lg)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><b>CRYPTOSCAN</b><br><span>Operations Center</span></div>
    </div>
    <span id="global" class="pill"><i></i>A ligar…</span>
    <div id="fontes" title="Fontes de dados"></div>
    <span class="sp"></span>
    <span id="sinc"></span>
    <span id="relogio"></span>
    <div class="seg" id="vista" title="Qualidade do 3D"><button data-vista="alta">3D</button><button data-vista="baixa">3D leve</button><button data-vista="2d">2D</button></div>
    <button class="btn" id="cofre" data-acao="cofre" title="Abre os dados privados das contas (cifrados) só neste aparelho">🔒 Abrir cofre</button>
    <a class="btn" href="v1.html" title="Versão anterior da interface" style="text-decoration:none;color:var(--fr)">v1</a>
  </header>
  <div id="kpis" aria-label="Indicadores principais"></div>
  <main>
    <div id="palco"><div id="carregar">A carregar os dados reais do CryptoScan…</div></div>
    <nav id="zonas" aria-label="Áreas do escritório">
      <button data-acao="tudo">Vista geral</button>
      <button data-acao="zona:comando">Comando</button><button data-acao="zona:operacoes">Operações</button><button data-acao="zona:quant">Quant</button>
      <button data-acao="zona:risco">Risco</button><button data-acao="zona:exchanges">Corretoras</button><button data-acao="zona:colaboracao">Colaboração</button><button data-acao="zona:global">Global</button>
    </nav>
    <section class="painel" id="agentes"><h3>Agentes<span class="sp"></span><button data-min title="Minimizar">–</button></h3><div class="corpo" id="lista-agentes"></div></section>
    <section class="painel" id="inspector" aria-live="polite"><h3><span id="insp-titulo">Detalhe</span><span class="sp"></span><button data-max title="Expandir">⤢</button><button id="insp-fechar" title="Fechar">✕</button></h3><div class="corpo" id="insp-corpo"></div></section>
    <section class="painel doca"><h3><div class="tabs">
        <button data-tab="posicoes" class="on">Posições e ordens</button><button data-tab="eventos">Eventos</button><button data-tab="alertas">Alertas</button>
        <button data-tab="mercado">Mercado global</button><button data-tab="estrategias">Estratégias</button><button data-tab="fontes">Fontes</button></div>
      <span class="sp"></span><button data-max title="Expandir">⤢</button><button data-min title="Minimizar">–</button></h3>
      <div class="corpo" id="doca-corpo"></div></section>
  </main>
</div>
<div id="erro-arranque" hidden></div>
<script src="cifra.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="central/app.js?v=20261110c"></script>
</body>
</html>
