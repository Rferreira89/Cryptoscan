name: OKX - verificar chave (so leitura)
# (04/11) Confirma que a chave da OKX funciona a partir do servidor europeu. Nao envia ordens.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: [self-hosted, eu]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verificar
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 tools/okx_verifica.py
      # (11/11, so no ramo investigacao/universo-bybit-ue; autorizacao do Rui 11/11 23:40) leitura das duas contas:
      # so pedidos GET; o log so tem regras e dados de mercado; os saldos vao so para o Telegram.
      - name: Leitura das contas (so leitura)
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 -m tools.leitura_contas
