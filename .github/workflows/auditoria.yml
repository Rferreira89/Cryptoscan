name: Auditoria de sinais (so leitura)
# Repete os campeoes nos ultimos dias com dados reais e passa cada sinal
# pelos filtros do sistema ao vivo (tools/auditoria_sinais.py). So le dados:
# nao envia ordens nem mexe no estado. Resultado no ramo `auditoria`.
on:
  schedule:
    - cron: "17 6 * * *"      # todos os dias: o que os campeoes viram e porque nao entrou
  workflow_dispatch:
    inputs:
      dias:
        description: "dias a repetir"
        default: "14"
permissions:
  contents: write
jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Auditoria
        run: |
          git fetch -q origin data && git show FETCH_HEAD:state.json > /tmp/state.json && git show FETCH_HEAD:scan.json > /tmp/scan.json
          python -m tools.auditoria_sinais out/auditoria.json "${{ github.event.inputs.dias || '14' }}"
          cd out && git init -q -b auditoria && git config user.name cryptoscan-bot \
            && git config user.email bot@users.noreply.github.com \
            && git add auditoria.json && git commit -q -m "auditoria $(date -u +%FT%TZ)" \
            && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" auditoria:auditoria
