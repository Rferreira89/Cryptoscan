name: Market Scanner
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["engine/**", "tests/**", ".github/workflows/scan.yml"]
permissions:
  contents: write
concurrency:
  group: scan
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes
        run: python -m unittest discover -q -s tests -t .
      - name: Scan
        run: |
          mkdir -p out
          python -m engine.run out | tee out/resumo.txt
      - name: Publicar snapshot (data em main, data-preview nos outros ramos)
        run: |
          TARGET=$([ "$GITHUB_REF" = refs/heads/main ] && echo data || echo data-preview)
          cd out
          git init -q -b data
          git config user.name "cryptoscan-bot"
          git config user.email "bot@users.noreply.github.com"
          git add scan.json resumo.txt
          git commit -q -m "scan $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "data:$TARGET"
