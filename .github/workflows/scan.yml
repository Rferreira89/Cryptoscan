name: Market Scanner
# Um job corre em ciclo (scan completo de 5 em 5 minutos e acompanhamento
# das operacoes abertas de minuto a minuto) durante ~5h20 e no fim
# relanca-se a si proprio. O agendamento do GitHub e pouco fiavel, por isso
# serve apenas de vigia: se a cadeia parar, volta a arranca-la.
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Biblioteca da cifra
        run: |
          pip install -q cryptography==43.0.3 || echo "sem cryptography, cifra em Python puro"
      - name: Ciclo de scans
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # (28/10, OK do Rui) repositorio publico: ficheiros completos cifrados no "cofre"
          # e copias sem dinheiro nos nomes de sempre (engine/run.py, engine/publico.py)
          DATA_KEY: ${{ secrets.DATA_KEY }}
          CRYPTOSCAN_COFRE: "1"
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          END=$(( $(date +%s) + 5*3600 + 20*60 ))
          publish() {
            ( cd out && git init -q -b data \
              && git config user.name cryptoscan-bot \
              && git config user.email bot@users.noreply.github.com \
              && git add scan.json state.json \
              && { for c in cofre_scan.json cofre_state.json cofre_audit.jsonl; do [ -f "$c" ] && git add "$c"; done; true; } \
              && { [ -f resumo.txt ] && git add resumo.txt || true; } \
              && { [ -f audit.jsonl ] && git add audit.jsonl || true; } \
              && { [ -f erros.txt ] && git add erros.txt || true; } \
              && { [ -f liquidez.json ] && git add liquidez.json || true; } \
              && { [ -f derivados.json ] && git add derivados.json || true; } \
              && { [ -f tg_enviadas.json ] && git add tg_enviadas.json || true; } \
              && git commit -q -m "$1 $(date -u +%FT%TZ)" \
              && git push -q -f "$PUSH_URL" data:data ) || echo "publicacao falhou"
          }
          while [ "$(date +%s)" -lt "$END" ]; do
            NOW=$(date +%s)
            # scan completo no primeiro minuto de cada 5 minutos; nos
            # restantes minutos, so acompanhamento das operacoes abertas
            if [ $(( NOW % 300 )) -lt 60 ]; then MODE=scan; else MODE=monitor; fi
            # (04/11) o agendamento do GitHub atrasa ou salta: o ciclo tambem lanca o agente OKX uma vez por hora
            # (06/11, OK do Rui) antes era so no minuto hh:07; se o scan das hh:05 demorava, a hora ficava sem agente
            # nem vigia (05/11: 3 h 45 min parado). Agora: uma vez por hora, no primeiro ciclo entre hh:07 e hh:30;
            # se o lancamento falhar, tenta no ciclo seguinte.
            # >>> lancamento-okx
            SH=$(( NOW % 3600 )); HORA=$(( NOW / 3600 ))
            if [ "$SH" -ge 420 ] && [ "$SH" -lt 1800 ] && [ "$HORA" != "${OKX_HORA:-}" ]; then
              OKX_HORA=$HORA
              gh workflow run okx-agente.yml --repo "${{ github.repository }}" --ref main >/dev/null 2>&1 || { echo "agente OKX nao lancado"; OKX_HORA=; }
              # (04/11) vigia: batimento do agente OKX e stops das operacoes reais
              timeout 60 python3 tools/vigia.py || echo "vigia falhou"
            fi
            # <<< lancamento-okx
            # (06/11, OK do Rui) o horario do GitHub nao lancou o paper TF-SHORT nem a recolha de dados novos: o ciclo
            # lanca-os uma vez por dia, depois da hora marcada (00:23 e 00:47 UTC; 10/11: mapa de exposicao 07:13), so se ainda nao houve execucao hoje.
            # Verifica so nos ciclos de scan (de 5 em 5 minutos). So lanca workflows de dados publicos e papel.
            if [ "$MODE" = scan ]; then
              HOJE=$(date -u +%F); SEG=$(( NOW % 86400 ))
              for par in "okx-tfshort-papel.yml:1380" "okx-recolha.yml:2820" "exposicao-diaria.yml:26000"; do
                WF=${par%%:*}; DESDE=${par##*:}
                if [ "$SEG" -ge "$DESDE" ]; then
                  if [ "$WF" = exposicao-diaria.yml ]; then
                    # (11/11, P7) so as execucoes diarias contam: uma manual no mesmo dia ja nao faz saltar a diaria
                    N=$(gh run list --repo "${{ github.repository }}" -w "$WF" --created ">=$HOJE" --json displayTitle -q '[.[] | select(.displayTitle | contains("(diario)"))] | length' 2>/dev/null || echo erro)
                    EXTRA="-f origem=diario"
                  else
                    N=$(gh run list --repo "${{ github.repository }}" -w "$WF" --created ">=$HOJE" --json databaseId -q 'length' 2>/dev/null || echo erro)
                    EXTRA=""
                  fi
                  if [ "$N" = 0 ]; then
                    gh workflow run "$WF" --repo "${{ github.repository }}" --ref main $EXTRA >/dev/null 2>&1 && echo "lancado $WF" || echo "$WF nao lancado"
                  fi
                fi
              done
              # (06/11, OK do Rui) relatorio semanal unico: ao domingo depois das 08:17 UTC, uma vez
              if [ "$(date -u +%u)" = 7 ] && [ "$SEG" -ge 29820 ]; then
                N=$(gh run list --repo "${{ github.repository }}" -w relatorio-semanal.yml --created ">=$HOJE" --json databaseId -q 'length' 2>/dev/null || echo erro)
                if [ "$N" = 0 ]; then
                  gh workflow run relatorio-semanal.yml --repo "${{ github.repository }}" --ref main >/dev/null 2>&1 && echo "lancado relatorio-semanal.yml" || echo "relatorio-semanal.yml nao lancado"
                fi
              fi
            fi
            echo "::group::$MODE $(date -u +%FT%TZ)"
            # codigo mais recente em cada ciclo
            git fetch -q origin main && git reset -q --hard FETCH_HEAD || true
            # paragem de emergencia: um ficheiro STOP na raiz do repositorio
            if [ -f STOP ]; then echo "STOP encontrado: scanner parado"; echo "::endgroup::"; break; fi
            rm -rf out && mkdir out
            OK=1
            # estado anterior (sinais ativos, registo, ultimo scan)
            if git ls-remote --exit-code -q origin refs/heads/data >/dev/null 2>&1; then
              if git fetch -q origin data; then
                for f in state.json audit.jsonl scan.json resumo.txt erros.txt liquidez.json derivados.json tg_enviadas.json cofre_scan.json cofre_state.json cofre_audit.jsonl; do
                  git show "FETCH_HEAD:$f" > "out/$f" 2>/dev/null || rm -f "out/$f"
                done
              else
                echo "nao foi possivel ler o estado anterior: ciclo ignorado"; OK=0
              fi
            fi
            if [ "$OK" = 1 ] && [ "$MODE" = monitor ]; then
              if python -m engine.monitor out; then
                if [ -f out/.publish ]; then rm -f out/.publish; publish monitor; fi
                # execucao com um toque: o servidor europeu le o estado ja publicado
                if [ -f out/.exec ]; then rm -f out/.exec; gh workflow run executar.yml --repo "${{ github.repository }}" --ref main || echo "executar nao lancado"; fi
              else
                echo "monitor falhou"
              fi
            elif [ "$OK" = 1 ] && python -m unittest discover -q -s tests -t . 2> /tmp/testes.log ; then
              # um scan que falha e repetido uma vez; se voltar a falhar, o
              # motivo fica registado em erros.txt no ramo data
              if python -m engine.run out > /dev/null 2> /tmp/run.log \
                 || { echo "scan falhou: nova tentativa"; sleep 20; python -m engine.run out > /dev/null 2> /tmp/run.log; }; then
                head -12 out/resumo.txt
                publish scan
                if [ -f out/.exec ]; then rm -f out/.exec; gh workflow run executar.yml --repo "${{ github.repository }}" --ref main || echo "executar nao lancado"; fi
              else
                echo "scan falhou duas vezes"; tail -5 /tmp/run.log
                { echo "$(date -u +%FT%TZ) scan falhou:"; tail -5 /tmp/run.log; } >> out/erros.txt
                tail -200 out/erros.txt > /tmp/e.txt && cp /tmp/e.txt out/erros.txt
                publish erro
              fi
            elif [ "$OK" = 1 ]; then
              echo "testes falharam: scan nao corre"; tail -8 /tmp/testes.log
              { echo "$(date -u +%FT%TZ) testes falharam:"; tail -8 /tmp/testes.log; } >> out/erros.txt
              tail -200 out/erros.txt > /tmp/e.txt && cp /tmp/e.txt out/erros.txt
              publish erro
            fi
            echo "::endgroup::"
            # combate da arena de hora a hora (o agendamento do GitHub falha
            # muitas vezes; o ciclo do scanner garante-o)
            # (06/11, OK do Rui) antes so no minuto hh:23 (05/11 23h ficou sem combate); agora uma vez por hora, no
            # primeiro ciclo entre hh:23 e hh:50; se o lancamento falhar, tenta no ciclo seguinte.
            # >>> lancamento-arena
            NOW=$(date +%s); SH=$(( NOW % 3600 )); HORA=$(( NOW / 3600 ))
            if [ "$SH" -ge 1380 ] && [ "$SH" -lt 3000 ] && [ "$HORA" != "${ARENA_HORA:-}" ]; then
              ARENA_HORA=$HORA
              gh workflow run arena.yml --repo "${{ github.repository }}" --ref main || { echo "arena nao lancada"; ARENA_HORA=; }
            fi
            # <<< lancamento-arena
            # dados da Binance e da conta no servidor europeu, de 15 em 15 min
            # (conta o tempo desde o ultimo pedido: um ciclo demorado nao o salta)
            if [ $(( $(date +%s) - ${LAST_EU:-0} )) -ge 870 ]; then
              gh workflow run europa-dados.yml --repo "${{ github.repository }}" --ref main && LAST_EU=$(date +%s) || echo "europa nao lancada"
            fi
            NOW=$(date +%s)
            sleep $(( 60 - NOW % 60 + 5 ))
          done
      - name: Relancar
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f STOP ]; then echo "STOP: nao relanca"; exit 0; fi
          gh workflow run scan.yml --repo "${{ github.repository }}" --ref main
