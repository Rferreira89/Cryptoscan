name: Historico para backtest
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m tools.fetch_history hist
          cd hist && git init -q -b history && git config user.name cryptoscan-bot && git config user.email bot@users.noreply.github.com
          git add . && git commit -q -m "historico $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" history:history
