name: CopyTrading - sondagem das APIs (so leitura)
# (17/11) Confirma o que as APIs permitem (OKX copy trading publico e da conta, Bybit EU, Hyperliquid).
# Nenhuma ordem, nenhuma alteracao; saida sem valores monetarios.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/copy_sondagem.py publico
      - run: python3 tools/copy_sondagem.py lideres
  eu:
    runs-on: [self-hosted, eu]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
        run: |
          python3 tools/copy_sondagem.py eu
          python3 tools/piloto_verificar.py
          git fetch -q origin data && git show FETCH_HEAD:state.json > /tmp/estado_bybit.json || true
          ESTADO_BYBIT=/tmp/estado_bybit.json python3 tools/verificar_contas.py HUMA ANTHROPIC BTC XLM
          ESTADO_BYBIT=/tmp/estado_bybit.json python3 tools/auditoria_custos.py
          python3 tools/auditoria_prazos.py
