name: CopyTrading - sondagem das APIs (so leitura)
# (18/11, RAMO DE PROVA, NAO PUBLICAR) so dados publicos: confirma que as fontes dao >= 600 velas de 4H validas.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publico:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import time
          from engine import sources, scanner
          now = time.time()
          for base in ("BTC", "ETH", "XLM", "SOL"):
              for s in sources.ALL:
                  try:
                      t0 = time.time(); c = s.candles(base, "4h", limit=scanner.VELAS_LONGAS_4H)
                      v = scanner.velas_longas_validas(c, now)
                      curtas, _ = scanner._velas(s, base, "4h")
                      ts = sorted(x["t"] for x in c)
                      print(s.name, base, "recebidas", len(c), "unicas", len(set(ts)), "validas_continuas", len(v) if v else None,
                            "ultima_fechada", bool(v) and v[-1]["t"] + 14400 <= now, "analise", len(curtas), f"{time.time()-t0:.1f}s", flush=True)
                  except Exception as e:
                      print(s.name, base, "falhou", type(e).__name__, str(e)[:100], flush=True)
          PY
