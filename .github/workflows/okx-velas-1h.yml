name: OKX - velas de 1h (so leitura publica)
# (12/11, autorizado pelo Rui 07:29) Recolha historica de velas de 1h dos X-Perps da OKX (e do mesmo ativo a vista)
# para a investigacao intradiaria. So pedidos publicos GET, SEM chaves; publica no ramo `okx-1h`. Manual e semanal.
on:
  workflow_dispatch:
    inputs:
      dias:
        description: "Dias de historico"
        default: "365"
  # (12/11) recolha completa as 09:27; atualizacao semanal num lote de 7 min (cache persistente no servidor europeu)
  schedule:
    - cron: "22 6 * * 1"
permissions:
  contents: write
concurrency:
  group: okx-velas-1h
  cancel-in-progress: false
jobs:
  velas:
    runs-on: [self-hosted, eu]
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Recolher (incremental sobre o ramo okx-1h)
        run: |
          if [ -f STOP ]; then echo "STOP"; exit 0; fi
          C="$HOME/okx1h-cache"
          # cache persistente no servidor; aproveita o que o lote interrompido de 07:31 ja gravou em /tmp/okx1h
          if [ ! -d "$C" ] && [ -d /tmp/okx1h ]; then mv /tmp/okx1h "$C"; fi
          mkdir -p "$C"
          if [ -z "$(ls -A "$C" 2>/dev/null)" ] && git fetch -q origin okx-1h 2>/dev/null; then git archive FETCH_HEAD | tar -x -C "$C"; fi
          if [ -f "$C/meta.json" ] && grep -q '"completo": true' "$C/meta.json" && [ "${{ github.event_name }}" = "schedule" ] \
             && [ $(( $(date +%s) - $(stat -c %Y "$C/meta.json") )) -lt 518400 ]; then echo "completa e recente"; touch "$C/.saltar"; exit 0; fi
          rm -f "$C/.saltar"
          python3 -m tools.okx_velas_1h "$C" --dias "${{ github.event.inputs.dias || '365' }}" --orcamento 420 --fios 3
      - name: Publicar no ramo okx-1h
        run: |
          if [ -f STOP ] || [ -f "$HOME/okx1h-cache/.saltar" ]; then exit 0; fi
          rm -rf /tmp/okx1h-pub && cp -r "$HOME/okx1h-cache" /tmp/okx1h-pub && cd /tmp/okx1h-pub && rm -rf .git && git init -q -b okx-1h && git config user.name cryptoscan-bot \
            && git config user.email bot@users.noreply.github.com && git add . \
            && git commit -q -m "okx 1h $(date -u +%FT%TZ)" \
            && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" okx-1h:okx-1h
