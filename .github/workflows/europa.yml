name: Europa (teste do servidor)
# Corre no servidor europeu (runner com a etiqueta "eu") e testa o acesso
# aos dados que o GitHub nos EUA nao alcanca. Resultado no ramo "europa-teste".
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  teste:
    runs-on: [self-hosted, eu]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Testar acessos
        env:
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          mkdir -p /tmp/eu && python3 -m tools.eu.teste /tmp/eu/teste.json
          cat /tmp/eu/teste.json
          cd /tmp/eu && rm -rf .git && git init -q -b europa-teste && git config user.name cryptoscan-bot \
            && git config user.email bot@users.noreply.github.com \
            && git add teste.json && git commit -q -m "teste $(date -u +%FT%TZ)" \
            && git push -q -f "$PUSH_URL" europa-teste:europa-teste
