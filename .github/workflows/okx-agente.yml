name: Agente OKX (oportunidades; dinheiro real com okx_config.json)
# (04/11) Varre os perpetuos de cripto da OKX Europa de hora a hora (tools/okx_agente.py). Nao envia ordens.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: okx-agente
  cancel-in-progress: false
jobs:
  agente:
    runs-on: [self-hosted, eu]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Varrer a OKX
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          rm -rf /tmp/okx && mkdir -p /tmp/okx
          if git ls-remote --exit-code -q origin refs/heads/okx >/dev/null 2>&1 && git fetch -q origin okx; then
            git show FETCH_HEAD:okx.json > /tmp/okx/okx.json || rm -f /tmp/okx/okx.json
          fi
          # (11/11, P3) se a volta anterior nao conseguiu publicar, retoma da copia local do runner (mais recente)
          python3 tools/publicar_estado.py recuperar /tmp/okx okx okx.json || true
          python3 tools/okx_agente.py /tmp/okx/okx.json
          python3 tools/okx_macro.py /tmp/okx/okx.json || echo "agente macro falhou"
          # (04/11) dinheiro e posicoes da OKX para a app: SEMPRE cifrado (DATA_KEY); se a cifra falhar, apaga
          python3 -m pip install -q --user cryptography==43.0.3 2>/dev/null || true
          if (cd tools && python3 -c "import okx_exec,sys; sys.exit(0 if okx_exec.cofre('/tmp/okx/cofre_okx.json') else 1)"); then
            python3 -m engine.cifra fechar /tmp/okx/cofre_okx.json && grep -q '"cifra"' /tmp/okx/cofre_okx.json || rm -f /tmp/okx/cofre_okx.json
          fi
          # (11/11, P3) publicacao com tentativas (5/15/45 s), copia local e aviso no Telegram se a falha persistir
          python3 tools/publicar_estado.py publicar /tmp/okx okx okx.json cofre_okx.json
