name: Agente OKX (oportunidades, so papel)
# (04/11) Varre os perpetuos de cripto da OKX Europa de hora a hora (tools/okx_agente.py). Nao envia ordens.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: okx-agente
  cancel-in-progress: false
jobs:
  agente:
    runs-on: [self-hosted, eu]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Varrer a OKX
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          rm -rf /tmp/okx && mkdir -p /tmp/okx
          if git ls-remote --exit-code -q origin refs/heads/okx >/dev/null 2>&1 && git fetch -q origin okx; then
            git show FETCH_HEAD:okx.json > /tmp/okx/okx.json || rm -f /tmp/okx/okx.json
          fi
          python3 tools/okx_agente.py /tmp/okx/okx.json
          python3 tools/okx_macro.py /tmp/okx/okx.json || echo "agente macro falhou"
          cd /tmp/okx && git init -q -b okx && git config user.name cryptoscan-bot \
            && git config user.email bot@users.noreply.github.com \
            && git add okx.json && git commit -q -m "okx $(date -u +%FT%TZ)" \
            && git push -q -f "$PUSH_URL" okx:okx
