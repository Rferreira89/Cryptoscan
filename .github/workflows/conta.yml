name: Conta Bybit (verificacao)
# Verifica a chave so de leitura da Bybit UE e publica um resumo minimo
# (sem a carteira inteira) no ramo "conta". Corre quando o modulo muda.
on:
  push:
    branches: [main]
    paths: ["engine/account.py", ".github/workflows/conta.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  conta:
    # servidor europeu: a Bybit UE bloqueia os servidores do GitHub nos EUA
    runs-on: [self-hosted, eu]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Ler a conta
        env:
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          python3 -m pip install -q --user cryptography==43.0.3 2>/dev/null || python3 -m pip install -q cryptography==43.0.3 2>/dev/null || echo "cryptography nao instalada: cifra em Python puro"
          git fetch -q origin data && { git show FETCH_HEAD:cofre_state.json > /tmp/state.json 2>/dev/null || git show FETCH_HEAD:state.json > /tmp/state.json; } || echo '{}' > /tmp/state.json
          python3 -m engine.cifra abrir /tmp/state.json
          mkdir -p /tmp/c && python3 -m engine.account /tmp/c/conta.json /tmp/state.json > /dev/null
          python3 -m engine.cifra fechar /tmp/c/conta.json
          cd /tmp/c && rm -rf .git && git init -q -b conta && git config user.name cryptoscan-bot \
            && git config user.email bot@users.noreply.github.com \
            && git add conta.json && git commit -q -m "conta $(date -u +%FT%TZ)" \
            && git push -q -f "$PUSH_URL" conta:conta
