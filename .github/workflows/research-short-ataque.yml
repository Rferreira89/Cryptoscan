name: Research short ataque (SHORT_SOBRECOMPRA)
# Disparar a mao: Actions -> este workflow -> Run workflow
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research-short-ataque
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Historico (ramo history)
        run: |
          mkdir -p /tmp/hist
          git fetch -q origin history history-delistadas || true
          mkdir -p /tmp/ramo /tmp/ret
          git archive origin/history | tar -x -C /tmp/ramo
          git archive origin/history-delistadas 2>/dev/null | tar -x -C /tmp/ret || true
          for f in /tmp/ramo/*.csv.gz; do [ -f "$f" ] && cp "$f" /tmp/hist/; done
          for f in /tmp/ret/*.csv.gz; do [ -f "$f" ] && cp -n "$f" /tmp/hist/ 2>/dev/null || true; done
          ls /tmp/hist/*.csv.gz 2>/dev/null | wc -l
      - name: Correr SHORT_SOBRECOMPRA
        run: |
          mkdir -p out
          python -m tools.research_short_ataque /tmp/hist out/research_short_ataque.json
          head -c 4000 out/research_short_ataque.json || true
      - name: Publicar artefacto e ramo
        run: |
          if [ ! -s out/research_short_ataque.json ]; then echo "sem resultados"; exit 1; fi
          cd out && git init -q -b research-short-ataque && git config user.name cryptoscan-bot \
            && git config user.email bot@users.noreply.github.com \
            && git add -A && git commit -q -m "research short ataque $(date -u +%FT%TZ)" \
            && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" research-short-ataque:research-short-ataque
