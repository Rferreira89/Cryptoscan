name: Arena (ringue de hora a hora)
# Cada lutador da arena combate nos ultimos 90 dias de mercado, em todas as
# moedas da Bybit UE, com as funcoes do sistema ao vivo e o teste contra o
# acaso (tools/arena_ringue.py). Resultado em forma.json no ramo `arena`,
# lido pelo scanner. So pode matar lutadores, nunca promover.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: arena
  cancel-in-progress: false
jobs:
  ringue:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # (17/11) so codigo que passou os testes: o ciclo do scanner publica o ultimo commit validado no ramo data
      # (codigo_bom.txt; ver tools/codigo_bom.sh). Sem esse ficheiro (ou se o commit nao vier), corre a main como antes.
      - name: Codigo validado
        run: |
          MAIN=$(git rev-parse --short HEAD)
          SHA=$(git fetch -q origin data 2>/dev/null && git show FETCH_HEAD:codigo_bom.txt 2>/dev/null | tr -dc '0-9a-f' | head -c 40 || true)
          if [ ${#SHA} != 40 ]; then
            echo "sem codigo validado publicado: corre a main ($MAIN)"
          elif [ "$SHA" = "$(git rev-parse HEAD)" ]; then
            echo "a main ($MAIN) e o codigo validado"
          elif git fetch -q origin "$SHA" 2>/dev/null && git checkout -q "$SHA"; then
            echo "codigo validado ${SHA:0:7} (a main esta em $MAIN, ainda por validar ou reprovada)"
          else
            echo "codigo validado ${SHA:0:7} indisponivel: corre a main ($MAIN)"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ringue
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
        run: |
          if [ -f STOP ]; then echo "STOP: arena parada"; exit 0; fi
          python -m unittest discover -q -s tests -t .
          git fetch -q origin data && { git show FETCH_HEAD:cofre_state.json > /tmp/state.json 2>/dev/null || git show FETCH_HEAD:state.json > /tmp/state.json; } || echo '{}' > /tmp/state.json
          pip install -q cryptography==43.0.3 || true
          python -m engine.cifra abrir /tmp/state.json
          python -m tools.arena_ringue out 90 /tmp/state.json
          cd out && git init -q -b arena && git config user.name cryptoscan-bot \
            && git config user.email bot@users.noreply.github.com \
            && git add forma.json && git commit -q -m "forma $(date -u +%FT%TZ)" \
            && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" arena:arena
