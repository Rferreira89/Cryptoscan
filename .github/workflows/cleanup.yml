name: Limpeza de ramos temporarios
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for b in data-preview telegram-test fase-1-dados-scanner; do
            git push origin --delete "$b" || true
          done
