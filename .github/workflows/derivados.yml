name: Historico de derivados (OI e long/short)
# (05/11, OK do Rui) Fase 1: open interest e racios long/short desde 2021 (data.binance.vision, publico)
# para o ramo "derivados". So dados: nao mexe em nada do que opera.
# (05/11 14:17, autorizacao limitada do Rui para o Passo 1 da Fase 2) nesta versao, que vive SO no ramo de
# trabalho fase2-dados: a pedido, recolha completa (OI em 30 min, financiamento, liquidacoes, moedas vivas e
# retiradas) para um ramo de dados NOVO, "derivados-fase2". Nao toca no ramo "derivados" nem no main, nao usa
# segredos (so a autorizacao automatica do GitHub para escrever no ramo de dados) e nao lanca outros workflows.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "recolha (descarrega e publica) ou listar_liquidacoes (so lista o arquivo; nao escreve dados)"
        required: false
        default: recolha
permissions:
  contents: write
concurrency:
  group: derivados-fase2
  cancel-in-progress: false
jobs:
  fase2:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes da recolha
        run: python -m unittest tests.test_fetch_derivados -v
      - name: Listar o arquivo de liquidacoes (so leitura)
        if: ${{ inputs.modo == 'listar_liquidacoes' }}
        run: python -m tools.fetch_derivados --listar-liquidacoes
      - name: Descarregar (retoma onde parou)
        if: ${{ inputs.modo != 'listar_liquidacoes' }}
        run: |
          git clone -q --depth 1 -b derivados-fase2 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" dados 2>/dev/null || mkdir -p dados
          git clone -q --depth 1 -b history "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" hist
          git clone -q --depth 1 -b history-delistadas "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ret
          VIVAS=$(ls hist/funding | sed 's/\.csv\.gz$//' | paste -sd, -)
          RETIRADAS=$(ls ret | grep '\.csv\.gz$' | sed 's/\.csv\.gz$//' | paste -sd, -)
          DERIVADOS_LIMITE_S=18000 python -m tools.fetch_derivados --fase2 dados --vivas "$VIVAS" --retiradas "$RETIRADAS"
      - name: Publicar no ramo derivados-fase2
        if: ${{ inputs.modo != 'listar_liquidacoes' }}
        run: |
          cd dados && rm -rf .git && find . -name '*.tmp' -delete
          git init -q -b derivados-fase2 && git config user.name cryptoscan-bot && git config user.email bot@users.noreply.github.com
          git add . && git commit -q -m "derivados-fase2 $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" derivados-fase2:derivados-fase2
          du -sh . ; find . -type f -not -path './.git/*' | wc -l
