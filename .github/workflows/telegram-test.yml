name: Teste Telegram
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Enviar mensagem de teste
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p out
          python -m engine.alerts "Cryptoscan: alertas ligados. Esta e uma mensagem de teste, nao e um sinal." | tee out/telegram.txt || true
          cd out && git init -q -b t && git config user.name cryptoscan-bot && git config user.email bot@users.noreply.github.com
          git add telegram.txt && git commit -q -m "teste telegram"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "t:telegram-test"
