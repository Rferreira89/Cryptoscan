name: Research Tests

on:
  push:
    branches:
      - research/opportunity-funnel-v2-20261114
    paths:
      - ".github/workflows/**"
      - "engine/**"
      - "tests/**"

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -q -s tests -t .
# Trigger de verificacao de testes
