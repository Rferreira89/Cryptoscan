name: Testes
on:
  push:
    branches: [main, investigacao/correcao-promo-syntax-20261116, investigacao/corrigir-bybit-429-20261116]
    paths: ["engine/**", "tools/**", "tests/**"]
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -q -s tests -t .
