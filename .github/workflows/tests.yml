name: Testes
on:
  push:
    branches: [main, investigacao/correcao-promo-syntax-20261116, quick-opportunities-okx-xperps]
    paths: ["engine/**", "tools/**", "tests/**", ".github/workflows/tests.yml"]
  pull_request:
    branches: [main]
    paths: ["engine/**", "tools/**", "tests/**", ".github/workflows/tests.yml"]
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -q -s tests -t .
