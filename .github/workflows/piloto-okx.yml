name: Piloto OKX (real isolado; so estrategias aprovadas e conferidas)
# (17/11, ordem do Rui) Executor real isolado (tools/piloto_okx.py): limites proprios (piloto_okx_config.json), so
# estrategias APPROVED_REAL/ACTIVE_REAL do registo central (ramo autonomo) e conferidas de novo pelo executor; sinais do
# paper trading. Volta de 15 em 15 min no runner europeu (o mesmo dos outros executores: as voltas correm em fila; os
# stops e objetivos ficam sempre na OKX, entre voltas). Estado cifrado (DATA_KEY) no ramo "piloto-okx" (o nome "piloto" colide com ramos piloto/...).
# modo verificar = so leitura da conta (nenhuma ordem); simular = volta completa sem ordens e sem guardar estado.
on:
  schedule:
    - cron: "11,26,41,56 * * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "verificar (so leitura) | simular (sem ordens) | ciclo"
        type: choice
        options: [verificar, simular, ciclo]
        default: verificar
permissions:
  contents: write
concurrency:
  group: piloto-okx
  cancel-in-progress: false
jobs:
  piloto:
    runs-on: [self-hosted, eu]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      # so codigo que passou os testes (igual aos outros executores; ver tools/codigo_bom.sh)
      - name: Codigo validado
        run: |
          MAIN=$(git rev-parse --short HEAD)
          SHA=$(git fetch -q origin data 2>/dev/null && git show FETCH_HEAD:codigo_bom.txt 2>/dev/null | tr -dc '0-9a-f' | head -c 40 || true)
          if [ ${#SHA} != 40 ]; then
            echo "sem codigo validado publicado: corre a main ($MAIN)"
          elif [ "$SHA" = "$(git rev-parse HEAD)" ]; then
            echo "a main ($MAIN) e o codigo validado"
          elif git fetch -q origin "$SHA" 2>/dev/null && git checkout -q "$SHA"; then
            echo "codigo validado ${SHA:0:7} (a main esta em $MAIN, ainda por validar ou reprovada)"
          else
            echo "codigo validado ${SHA:0:7} indisponivel: corre a main ($MAIN)"
          fi
          if [ ! -f tools/piloto_okx.py ]; then echo "o codigo validado ainda nao tem o piloto: nada a fazer"; touch /tmp/piloto_ausente; fi
      - name: Volta do piloto
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
        run: |
          [ -f /tmp/piloto_ausente ] && exit 0
          MODO="${{ github.event.inputs.modo }}"; [ -z "$MODO" ] && MODO=ciclo
          rm -rf /tmp/piloto && mkdir -p /tmp/piloto
          if [ "$MODO" = verificar ]; then
            python3 tools/piloto_okx.py /tmp/piloto --verificar
            exit 0
          fi
          python3 -m pip install -q --user cryptography==43.0.3 2>/dev/null || true
          RC=0; git ls-remote --exit-code -q origin refs/heads/piloto-okx >/dev/null 2>&1 || RC=$?
          if [ "$RC" = 0 ]; then
            git fetch -q origin piloto-okx && git show FETCH_HEAD:piloto_estado.json > /tmp/piloto/piloto_estado.json \
              || { echo "nao consegui ler o estado do piloto: volta cancelada (nada enviado)"; rm -rf /tmp/piloto; exit 1; }
            git rev-parse FETCH_HEAD > /tmp/piloto/.sha_base
            python3 -m engine.cifra abrir /tmp/piloto/piloto_estado.json \
              || { echo "nao consegui decifrar o estado: volta cancelada (nada enviado)"; rm -rf /tmp/piloto; exit 1; }
          elif [ "$RC" != 2 ]; then
            echo "nao consegui consultar o ramo piloto-okx (codigo $RC): volta cancelada"; rm -rf /tmp/piloto; exit 1
          fi
          git fetch -q origin autonomo 2>/dev/null && {
            git show FETCH_HEAD:hunter/estrategias_registo.json > /tmp/piloto/estrategias_registo.json 2>/dev/null || rm -f /tmp/piloto/estrategias_registo.json
            git show FETCH_HEAD:hunter/papel_estado.json > /tmp/piloto/papel_estado.json 2>/dev/null || rm -f /tmp/piloto/papel_estado.json
            git show FETCH_HEAD:copy/sinais.json > /tmp/piloto/copy_sinais.json 2>/dev/null || rm -f /tmp/piloto/copy_sinais.json; } || true
          if [ "$MODO" = simular ]; then
            python3 tools/piloto_okx.py /tmp/piloto --simular
            rm -rf /tmp/piloto                                  # a simulacao nao toca no estado real
            exit 0
          fi
          python3 tools/piloto_okx.py /tmp/piloto
          if [ -n "$DATA_KEY" ] && python3 -m engine.cifra fechar /tmp/piloto/piloto_estado.json && grep -q '"cifra"' /tmp/piloto/piloto_estado.json; then
            echo "estado cifrado"
          else
            echo "sem cifra: o estado NAO e publicado (o piloto nao abre ordens sem DATA_KEY)"; rm -f /tmp/piloto/piloto_estado.json
          fi
      - name: Publicar o estado
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          if [ ! -s /tmp/piloto/piloto_publico.json ]; then echo "sem estado para publicar"; exit 0; fi
          export ESTADO_SHA_BASE=$(cat /tmp/piloto/.sha_base 2>/dev/null)
          F="piloto_publico.json"; [ -s /tmp/piloto/piloto_estado.json ] && F="piloto_estado.json $F"
          python3 tools/publicar_estado.py publicar /tmp/piloto piloto-okx $F
