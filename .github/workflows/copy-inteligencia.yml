name: CopyTrading - inteligencia e decisoes (sem chaves, sem ordens)
# (17/11, ordem do Rui) COPY_INTELLIGENCE + SMART_COPY: ranking de traders (OKX publico, Hyperliquid) de hora a hora,
# posicoes dos traders seguidos de ~2 em 2 min, decisoes automaticas; os sinais COPY vao para copy/sinais.json (ramo
# autonomo) e o piloto OKX e lancado logo que houver copias novas (a execucao real e so la, com os limites do piloto).
# ~5 h 40 min por execucao; no fim relanca-se a si proprio. Codigo no ramo copytrading.
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: copy-inteligencia
  cancel-in-progress: false
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copytrading
      - name: Voltas
        env:
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          FIM=$(( $(date +%s) + 338*60 ))
          while [ "$(date +%s)" -lt "$FIM" ]; do
            rm -rf /tmp/au
            git clone -q --depth 1 -b autonomo "$PUSH_URL" /tmp/au 2>/dev/null || { sleep 60; continue; }
            RC=0; timeout 900 python3 -m tools.copy.correr /tmp/au || RC=$?
            if [ "$RC" = 0 ] || [ "$RC" = 3 ]; then
              bash tools/copy/publicar.sh /tmp/au || echo "publicacao falhou"
              if [ "$RC" = 0 ]; then
                gh workflow run piloto-okx.yml --repo "${{ github.repository }}" --ref main -f modo=ciclo || echo "nao consegui lancar o piloto"
              fi
            else
              echo "volta do copy falhou ($RC): a seguinte tenta de novo"
            fi
            sleep 100
          done
      - name: Relancar
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run copy-inteligencia.yml --repo "${{ github.repository }}" --ref main
