name: Sonda de dados
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out && python tools/probe.py > out/probe.txt 2>&1 || true
          cd out && git init -q -b p && git config user.name cryptoscan-bot && git config user.email bot@users.noreply.github.com
          git add probe.txt && git commit -q -m probe
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "p:data-preview"
