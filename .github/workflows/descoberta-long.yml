name: Descoberta LONG (avaliacao continua; so leitura publica)
# (12/11, OK do Rui 02:13) Motor continuo de descoberta LONG. Uma vez por semana volta a avaliar todas as familias
# LONG existentes em todas as moedas com historia (incluindo as retiradas), por fase do mercado e por corretora,
# com o criterio fixo de tools/descoberta_long.py, e publica o resultado no ramo `descoberta-long`.
# SEM chaves de corretoras, SEM ordens, SEM efeito em estrategias autorizadas: so dados publicos.
on:
  schedule:
    - cron: "41 5 * * 0"
  workflow_dispatch:
    inputs:
      atualizar_historico:
        description: "Descarregar velas novas antes de avaliar (sim/nao)"
        default: "sim"
permissions:
  contents: write
concurrency:
  group: descoberta-long
  cancel-in-progress: false
jobs:
  descoberta:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dados (ramos history e history-delistadas)
        run: |
          if [ -f STOP ]; then echo "STOP"; exit 0; fi
          python -m unittest -q tests.test_descoberta_long
          mkdir -p /tmp/hist
          if [ "${{ github.event.inputs.atualizar_historico || 'sim' }}" = "sim" ]; then
            python -m tools.fetch_history /tmp/hist || echo "descarga falhou: uso o ramo history"
          fi
          git fetch -q origin history history-delistadas
          mkdir -p /tmp/ramo /tmp/ret
          git archive origin/history | tar -x -C /tmp/ramo
          git archive origin/history-delistadas | tar -x -C /tmp/ret
          for f in /tmp/ramo/*.csv.gz; do [ -f "/tmp/hist/$(basename $f)" ] || cp "$f" /tmp/hist/; done
          for f in /tmp/ret/*.csv.gz; do [ -f "/tmp/hist/$(basename $f)" ] || cp "$f" /tmp/hist/; done
          mkdir -p /tmp/hist/funding && cp -n /tmp/ramo/funding/*.csv.gz /tmp/hist/funding/ 2>/dev/null || true
          ls /tmp/hist/*.csv.gz | wc -l
      - name: Avaliar
        run: |
          if [ -f STOP ]; then exit 0; fi
          mkdir -p out
          python -m tools.descoberta_long /tmp/hist out/descoberta_long.json --processos 4
      - name: Publicar no ramo descoberta-long
        run: |
          if [ -f STOP ] || [ ! -s out/descoberta_long.json ]; then exit 0; fi
          cd out && git init -q -b descoberta-long && git config user.name cryptoscan-bot \
            && git config user.email bot@users.noreply.github.com \
            && git add descoberta_long.json && git commit -q -m "descoberta long $(date -u +%FT%TZ)" \
            && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" descoberta-long:descoberta-long
